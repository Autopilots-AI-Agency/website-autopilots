[build]
  # Consultant functions import the isolated runtime outside this base directory.
  # Rebuild for those changes too; an empty/identical cache ref must not skip a build.
  ignore = 'test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../autopilots-platform/src/consultant'
  command = "npm run build && npm run release:verify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--version"

[functions]
  node_bundler = "esbuild"

[context.production.environment]
  PUBLIC_AUTOPILOTS_SCAN_BRIDGE = "true"

[[redirects]]
  from = "/ai-scan-runtime/health"
  to = "https://backend-b05f7168-a0d2-46df-a25a-818ec27416d6.rumata.dev/backend-api/b05f7168-a0d2-46df-a25a-818ec27416d6/health"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"
